<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ext-reload helper</title>
<style>
  :root {
    --page: #eef3f0; --card: #ffffff; --fg: #1b1d22; --muted: #565c68; --line: #e3e7e5;
    --brand: #3ddc97; --ok: #0b7a52; --note-bg: #e6f8ef; --focus: #0b7a52;
    --gh-bg: #f4f5f7; --gh-fg: #1b1d22; --gh-line: #cfd4db;
    --gh-bg-h: #e8eaee; --gh-line-h: #9aa2af;
    --cf-bg: #fff0e1; --cf-fg: #6b2c00; --cf-line: #f0b384; --cf-accent: #e0453f;
    --cf-bg-h: #ffe2c4; --cf-line-h: #d9884a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #15171c; --card: #1f2227; --fg: #e8eaee; --muted: #a6acb7; --line: #33373e;
      --ok: #3ddc97; --note-bg: #1c3228; --focus: #3ddc97;
      --gh-bg: #2a2d34; --gh-fg: #e8eaee; --gh-line: #444955;
      --gh-bg-h: #353942; --gh-line-h: #6d7583;
      --cf-bg: #3a2819; --cf-fg: #ffd9b8; --cf-line: #744d2e; --cf-accent: #ff7f7a;
      --cf-bg-h: #4a3320; --cf-line-h: #b97a43;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; padding: 10px; background: var(--page); color: var(--fg);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif; }
  .card { background: var(--card); border-radius: 16px; padding: 18px 16px 16px;
          border: 1px solid var(--line); }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  header img { width: 37px; height: 37px; border-radius: 9px; display: block; }
  h1 { font-size: 17px; line-height: 1.25; margin: 0; }
  p { margin: 0 0 12px; color: var(--muted); }
  .note { display: flex; align-items: center; gap: 9px; margin: 0; padding: 10px 12px;
          background: var(--note-bg); color: var(--fg); border-radius: 12px; font-weight: 400; font-size: 14px; }
  .note svg { flex: none; width: 20px; height: 20px; color: var(--ok); }
  .links { display: grid; gap: 10px; margin-top: 16px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px;
         min-height: 46px; padding: 9px 14px; border: 1px solid; border-radius: 12px;
         font: inherit; font-weight: 600; text-decoration: none;
         transition: background-color .12s, border-color .12s, transform .12s; }
  .btn svg { flex: none; width: 20px; height: 20px; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: none; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .gh { background: var(--gh-bg); color: var(--gh-fg); border-color: var(--gh-line); }
  .gh:hover { background: var(--gh-bg-h); border-color: var(--gh-line-h); }
  .coffee { background: var(--cf-bg); color: var(--cf-fg); border-color: var(--cf-line); }
  .coffee:hover { background: var(--cf-bg-h); border-color: var(--cf-line-h); }
  .coffee svg { width: 24px; height: 24px; margin: -2px 0; }
  .coffee .heart { fill: var(--cf-accent); stroke: none; }
  .hint { margin: -4px 0 0; text-align: center; font-size: 14px; line-height: 1.4; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
</style>
</head>
<body>
<main class="card">
  <header>
    <img src="icons/icon-48.png" alt="">
    <h1>ext-reload helper</h1>
  </header>
  <p>Lets your coding agent, or any terminal, reload your unpacked extensions and the tabs they run on, so
    nobody has to press Reload at chrome://extensions.</p>
  <p class="note">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="currentColor" opacity=".18"/><path d="M5.8 10.3l2.9 2.9 5.5-5.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>You don't need to do anything here.</span>
  </p>
  <nav class="links">
    <a class="btn gh" href="https://github.com/dominic-lam/ext-reload" target="_blank" rel="noopener" aria-label="ext-reload is open source on GitHub (opens in a new tab)" title="github.com/dominic-lam/ext-reload">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      <span>Open Source on GitHub</span>
    </a>
    <a class="btn coffee" href="https://ko-fi.com/dominiclam" target="_blank" rel="noopener" aria-label="Buy me a coffee on Ko-fi (opens in a new tab)" title="ko-fi.com/dominiclam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.5 9h12.5v4.5a5 5 0 0 1-5 5H8.5a5 5 0 0 1-5-5V9Z"/>
        <path d="M16 10.5h1.2a2.8 2.8 0 0 1 0 5.6H15.5"/>
        <path d="M7 3.6c-.9 1 .9 1.9 0 3M11 3.6c-.9 1 .9 1.9 0 3"/>
        <path class="heart" d="M9.75 16.4s-2.9-1.8-2.9-3.7a1.55 1.55 0 0 1 2.9-.8 1.55 1.55 0 0 1 2.9.8c0 1.9-2.9 3.7-2.9 3.7Z"/>
        <path d="M3 21.2h14"/>
      </svg>
      <span>Buy me a coffee</span>
    </a>
    <p class="hint">Totally optional, but appreciated.</p>
  </nav>
</main>
</body>
</html>
